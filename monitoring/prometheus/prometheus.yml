global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-boot-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'auth-service:8081'
        - 'procurement-service:8082'
        - 'inventory-service:8083'
        - 'order-service:8084'
        - 'logistics-service:8085'
        - 'notification-service:8086'
        - 'analytics-service:8087'
        - 'api-gateway:8080'
        - 'eureka-server:8761'
