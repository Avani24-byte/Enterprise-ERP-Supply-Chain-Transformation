version: "3.9"

services:
  procurement-db:
    image: postgres:15-alpine
    container_name: procurement-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: procurement_db
      POSTGRES_USER: procurement_user
      POSTGRES_PASSWORD: procurement_pass
    ports:
      - "5432:5432"
    volumes:
      - procurement_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement_user -d procurement_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  inventory-db:
    image: postgres:15-alpine
    container_name: inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
    ports:
      - "5433:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  order-db:
    image: postgres:15-alpine
    container_name: order-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
    ports:
      - "5434:5432"
    volumes:
      - order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  notification-db:
    image: postgres:15-alpine
    container_name: notification-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_pass
    ports:
      - "5435:5432"
    volumes:
      - notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  logistics-db:
    image: mongo:7
    container_name: logistics-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: logistics_db
      MONGO_INITDB_ROOT_USERNAME: logistics_user
      MONGO_INITDB_ROOT_PASSWORD: logistics_pass
    ports:
      - "27017:27017"
    volumes:
      - logistics_data:/data/db
      - ./logistics-service/mongodb/indexes.js:/docker-entrypoint-initdb.d/01_indexes.js:ro
      - ./logistics-service/mongodb/seed_data.js:/docker-entrypoint-initdb.d/02_seed.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - erp-network

  cache:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - erp-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "29092:29092"
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - erp-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8090:8080"
    networks:
      - erp-network

  flyway-procurement:
    image: flyway/flyway:9-alpine
    command: -url=jdbc:postgresql://procurement-db:5432/procurement_db -user=procurement_user -password=procurement_pass -connectRetries=60 migrate
    volumes:
      - ./procurement-service/src/main/resources/db/migration:/flyway/sql
    depends_on:
      procurement-db:
        condition: service_healthy
    networks:
      - erp-network

  flyway-inventory:
    image: flyway/flyway:9-alpine
    command: -url=jdbc:postgresql://inventory-db:5432/inventory_db -user=inventory_user -password=inventory_pass -connectRetries=60 migrate
    volumes:
      - ./inventory-service/src/main/resources/db/migration:/flyway/sql
    depends_on:
      inventory-db:
        condition: service_healthy
    networks:
      - erp-network

  flyway-order:
    image: flyway/flyway:9-alpine
    command: -url=jdbc:postgresql://order-db:5432/order_db -user=order_user -password=order_pass -connectRetries=60 migrate
    volumes:
      - ./order-service/src/main/resources/db/migration:/flyway/sql
    depends_on:
      order-db:
        condition: service_healthy
    networks:
      - erp-network

volumes:
  procurement_data:
    driver: local
  inventory_data:
    driver: local
  order_data:
    driver: local
  notification_data:
    driver: local
  logistics_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_log:
    driver: local
  kafka_data:
    driver: local

networks:
  erp-network:
    driver: bridge
    name: erp-network
