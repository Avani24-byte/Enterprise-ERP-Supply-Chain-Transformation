name: ERP Supply Chain CI/CD

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # Converts repository name to lowercase automatically
  IMAGE_NAME_PREFIX: ${{ github.repository_owner }}

jobs:
  # ==========================================
  # JAVA MICROSERVICES (Matrix Build)
  # ==========================================
  build-and-test-java:
    name: Build & Push Java - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: 
          - auth-service
          - procurement-service
          - inventory-service
          - order-service
          - logistics-service
          - notification-service
          - analytics-service
          - api-gateway
          - eureka-server
      # Prevents other services from failing/stopping if one service fails
      fail-fast: false
      
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check if POM exists
        id: check_pom
        run: |
          if [ -f "./${{ matrix.service }}/pom.xml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Skipping ${{ matrix.service }} because pom.xml is missing"
          fi

      - name: Run Maven Tests
        if: steps.check_pom.outputs.exists == 'true'
        run: mvn clean test
        working-directory: ./${{ matrix.service }}

      - name: Log in to the Container registry
        if: steps.check_pom.outputs.exists == 'true'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # We use lower to ensure image name is always lowercase (GHCR requirement)
      - name: Convert repository name to lowercase
        if: steps.check_pom.outputs.exists == 'true'
        run: echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        if: steps.check_pom.outputs.exists == 'true'
        uses: docker/build-push-action@v4
        with:
          context: ./${{ matrix.service }}
          file: ./devops-templates/Dockerfile.java
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/${{ matrix.service }}:${{ github.sha }}

  # ==========================================
  # PYTHON FORECASTING SERVICE
  # ==========================================
  build-and-test-python:
    name: Build & Push Python - forecasting-service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Check if Python service exists
        id: check_python
        run: |
          if [ -f "./forecasting-service/requirements.txt" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Skipping Python service because requirements.txt is missing"
          fi

      - name: Install dependencies and test
        if: steps.check_python.outputs.exists == 'true'
        run: |
          pip install -r requirements.txt
          # Uncomment to run tests once teammate has written them:
          # pytest
        working-directory: ./forecasting-service

      - name: Log in to the Container registry
        if: steps.check_python.outputs.exists == 'true'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        if: steps.check_python.outputs.exists == 'true'
        run: echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        if: steps.check_python.outputs.exists == 'true'
        uses: docker/build-push-action@v4
        with:
          context: ./forecasting-service
          file: ./devops-templates/Dockerfile.python
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/forecasting-service:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/forecasting-service:${{ github.sha }}

  # ==========================================
  # REACT FRONTEND
  # ==========================================
  build-and-test-react:
    name: Build & Push React - frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Check if React frontend exists
        id: check_react
        run: |
          if [ -f "./frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Skipping React frontend because package.json is missing"
          fi

      - name: Install dependencies and build
        if: steps.check_react.outputs.exists == 'true'
        run: |
          npm ci
          # npm test -- --watchAll=false (if test suite is added)
          npm run build
        working-directory: ./frontend

      - name: Log in to the Container registry
        if: steps.check_react.outputs.exists == 'true'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Convert repository name to lowercase
        if: steps.check_react.outputs.exists == 'true'
        run: echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        if: steps.check_react.outputs.exists == 'true'
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./devops-templates/Dockerfile.react
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/frontend:${{ github.sha }}
