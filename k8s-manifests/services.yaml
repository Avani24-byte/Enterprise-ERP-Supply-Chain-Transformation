# ==========================================
# EUREKA SERVER
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
spec:
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
      - name: eureka-server
        image: erp/eureka-server:latest
        imagePullPolicy: Never # For minikube local images
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: erp-config
              key: SPRING_PROFILES_ACTIVE
        ports:
        - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
spec:
  selector:
    app: eureka-server
  ports:
  - port: 8761
    targetPort: 8761
---
# ==========================================
# API GATEWAY
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: erp/api-gateway:latest
        imagePullPolicy: Never
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: erp-config
              key: SPRING_PROFILES_ACTIVE
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: erp-config
              key: EUREKA_URL
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  type: NodePort # Expose for external access via minikube
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
---
# ==========================================
# MICROSERVICES (Example: Procurement)
# Note: Repeat this pattern for auth, inventory, order, logistics, notification, analytics
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: procurement-service
spec:
  selector:
    matchLabels:
      app: procurement-service
  template:
    metadata:
      labels:
        app: procurement-service
    spec:
      containers:
      - name: procurement-service
        image: erp/procurement-service:latest
        imagePullPolicy: Never
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: erp-config
              key: SPRING_PROFILES_ACTIVE
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: erp-config
              key: EUREKA_URL
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres:5432/erp_db
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: erp-config
              key: POSTGRES_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: erp-secrets
              key: POSTGRES_PASSWORD
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: erp-config
              key: KAFKA_BROKER
        ports:
        - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: procurement-service
spec:
  selector:
    app: procurement-service
  ports:
  - port: 8082
    targetPort: 8082
---
